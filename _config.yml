title: Blog
description: ""
url: ""
baseurl: ""

permalink: /:year/:month/:day/:title/

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

sass:
  sass_dir: _sass
  style: compressed

include:
  - _pages

defaults:
  - scope:
      path: "_pages"
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .claude
