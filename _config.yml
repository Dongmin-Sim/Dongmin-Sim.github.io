title: Blog
description: ""
url: ""
baseurl: ""

permalink: /:year/:month/:day/:title/

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

sass:
  sass_dir: _sass
  style: compressed

include:
  - _pages

# 조각글 컬렉션 — 날짜 없는 how-to 토막 모음. 메인 목록(_posts)과 분리.
collections:
  snippets:
    output: true
    permalink: /snippets/:title/

defaults:
  - scope:
      path: "_pages"
    values:
      layout: default
  # _posts/{dev,retro}/ 폴더 = 카테고리. Jekyll은 _posts 안쪽 하위 폴더를
  # 카테고리로 흡수하지 않으므로 여기서 경로 기준으로 부여한다.
  - scope:
      path: "_posts/dev"
    values:
      categories: [dev]
  - scope:
      path: "_posts/retro"
    values:
      categories: [retro]
  - scope:
      path: ""
      type: snippets
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .claude
