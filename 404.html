---
layout: default
title: 404
permalink: /404.html
---

<div class="not-found">
  <h1 class="not-found__title">404</h1>
  <p class="not-found__message">찾을 수 없는 페이지입니다</p>
  <p class="not-found__message--en">Page not found</p>
  <a href="{{ '/' | relative_url }}" class="not-found__link">홈으로 돌아가기</a>

  {% assign recent = site.posts | slice: 0, 5 %}
  {% if recent.size > 0 %}
  <div class="not-found__recent">
    <p class="not-found__recent-label">최근 글</p>
    <ul>
      {% for post in recent %}
      <li><a href="{{ post.url | relative_url }}">{{ post.title }}</a></li>
      {% endfor %}
    </ul>
  </div>
  {% endif %}
</div>
