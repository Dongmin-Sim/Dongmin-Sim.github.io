<script>
(function () {
  var headings = document.querySelectorAll('.post-content h2, .post-content h3');
  if (headings.length < 2) return;

  var ul = document.querySelector('.toc ul');
  var links = [];

  headings.forEach(function (h) {
    if (!h.id) {
      h.id = h.textContent
        .trim()
        .toLowerCase()
        .replace(/[^\w\s가-힣-]/g, '')
        .replace(/\s+/g, '-');
    }

    var li = document.createElement('li');
    var a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    a.className = 'toc__link';
    if (h.tagName === 'H3') li.className = 'toc__item--sub';

    li.appendChild(a);
    ul.appendChild(li);
    links.push({ el: a, target: h });
  });

  var current = null;

  function activate(link) {
    if (current) current.classList.remove('toc__link--active');
    link.classList.add('toc__link--active');
    current = link;
  }

  var observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        var link = links.find(function (l) { return l.target === entry.target; });
        if (link) activate(link.el);
      }
    });
  }, { rootMargin: '0px 0px -70% 0px' });

  headings.forEach(function (h) { observer.observe(h); });

  var lastLink = links[links.length - 1].el;
  window.addEventListener('scroll', function () {
    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 50) {
      activate(lastLink);
    }
  }, { passive: true });
})();
</script>
